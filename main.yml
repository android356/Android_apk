name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace || echo "Release build completed with notes"

      - name: Locate APK files
        id: apk-finder
        run: |
          echo "Listing generated APKs:"
          find app/build/outputs/apk/ -type f -name "*.apk"
          DEBUG_APK=$(find app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAutoDeploy-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload All Output APKs
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAutoDeploy-All-APKs
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: ignore
